spring:
  application:
    name: ledger
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
